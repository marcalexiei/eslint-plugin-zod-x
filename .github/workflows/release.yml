name: Release

# workflow_run is restricted to the main branch and guarded at the job level
# with `github.event.workflow_run.head_repository.full_name == github.repository`
# to prevent fork PRs from triggering the release job.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  HUSKY: 0

jobs:
  release:
    name: Release

    environment: release-npm

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    permissions:
      contents: write # required to push release commits and tags
      pull-requests: write # required to create and update release PRs
      id-token: write # required for npm OIDC trusted publishing

    steps:
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@35654007fc916287603cd114516a3d1295f62689 # v2.0.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Configure git user for GitHub App
        env:
          BOT_NAME: ${{ steps.release-helper.outputs.bot-name }}
          BOT_EMAIL: ${{ steps.release-helper.outputs.bot-email }}
        run: |
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@35654007fc916287603cd114516a3d1295f62689 # v2.0.0

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          commit: 'chore: release'
          title: 'chore: release'
          publish: 'pnpm release'
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ steps.release-helper.outputs.token }}

  on-ci-fail:
    name: 'Failure'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'CI failed. Release won't be executed'
